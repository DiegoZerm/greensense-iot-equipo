name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  servidor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: servidor
    services:
      db:
        image: timescale/timescaledb:latest-pg17
        env:
          POSTGRES_USER: greensense
          POSTGRES_PASSWORD: pruebas
          POSTGRES_DB: greensense_pruebas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U greensense"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      GREENSENSE_PRUEBAS_DB: postgresql+psycopg://greensense:pruebas@localhost:5432/greensense_pruebas
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: servidor/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=greensense --cov-report=term-missing

  firmware:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - run: pio test -e native
      - run: pio run -e esp32dev

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build
