# Sirve la app y manda /api al servidor. El HTTPS lo pone quien esté delante (el túnel).
server {
    listen 80;
    root /usr/share/nginx/html;

    # El tiempo real (SSE) no debe guardarse en búfer ni cortarse por inactividad.
    location = /api/v1/eventos {
        proxy_pass http://servidor:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1d;
    }

    location /api/ {
        proxy_pass http://servidor:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # El service worker y el índice deben revisarse siempre, para que la app se actualice.
    location = /ngsw-worker.js {
        add_header Cache-Control "no-cache";
    }
    location = /ngsw.json {
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Los archivos de la compilación llevan un hash en el nombre: nunca cambian.
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Rutas de la app, como /alertas: las resuelve Angular.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
