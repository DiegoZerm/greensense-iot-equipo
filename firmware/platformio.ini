; Firmware del nodo GreenSense IoT
[platformio]
default_envs = esp32dev

[env]
build_flags =
    -D FIRMWARE_VERSION=\"0.3.0\"

; Placa real: ESP32 DevKit V1. La versión de la plataforma queda fija para que la CI
; compile con el mismo framework (Arduino 2, ESP-IDF 4.4) que se usa al cargar el nodo.
[env:esp32dev]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
; A la velocidad por defecto la carga falla con algunos adaptadores USB.
upload_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    ${env.build_flags}
    -std=gnu++17
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    bblanchon/ArduinoJson@^7.2

; Pruebas en la computadora de lib/nucleo, que no toca hardware: pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags =
    ${env.build_flags}
    -std=gnu++17
    -Wall
    -D UNITY_INCLUDE_DOUBLE
lib_deps =
    bblanchon/ArduinoJson@^7.2
