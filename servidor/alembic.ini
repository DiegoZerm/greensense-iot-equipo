[alembic]
script_location = %(here)s/migraciones
file_template = %%(rev)s_%%(slug)s
# La URL de la base de datos se toma de greensense.config (infra/.env).

[loggers]
keys = root,alembic

[handlers]
keys = consola

[formatters]
keys = simple

[logger_root]
level = WARNING
handlers = consola

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_consola]
class = StreamHandler
args = (sys.stderr,)
formatter = simple

[formatter_simple]
format = %(levelname)s %(name)s: %(message)s
